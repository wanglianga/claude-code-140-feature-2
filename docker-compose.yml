services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pvapp
      POSTGRES_PASSWORD: pvapp
      POSTGRES_DB: pvplatform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvapp -d pvplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"   # 宿主机 5433 → 容器 5432，避免与本机已装 PostgreSQL 的 5432 冲突

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://pvapp:pvapp@db:5432/pvplatform?sslmode=disable"
      JWT_SECRET: "please-change-this-secret-in-production"
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
